# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: oiboy200/limbo-website
  branch: main
  base_url: https://limbo-cms-auth.giovanniongaro86.workers.dev
  auth_endpoint: auth
  auth_methods: [oauth]

media_folder: "uploads"
public_folder: "/uploads"

site_url: "https://limbo-website.pages.dev"
display_url: "https://limbo-website.pages.dev"
logo_url: "/assets/limbo-logo-original.png"

i18n:
  structure: single_file_default_root
  locales: [it, en]
  default_locale: it
slug:
  encoding: unicode
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: settings
    i18n: true
    label: "00 — Identità del sito"
    files:
      - name: site
        label: Logo e immagini globali
        file: content/site-settings.json
        format: json
        fields:
          - { label: "Logo LIMBO", name: logo, widget: image }
          - { label: "Immagine predefinita / fallback", name: fallback_image, widget: image, required: false }
  - name: pages
    i18n: true
    label: Pagine
    files:
      - name: home
        label: "01 — Homepage"
        i18n: true
        file: content/pages/home.json
        format: json
        fields:
          - { label: "Intro — EN", name: hero_intro, widget: text, i18n: true }
          - { label: "Immagine Workshop", name: workshop_image, widget: image, i18n: true }
          - { label: "Immagine Custom", name: custom_image, widget: image, i18n: true }
          - { label: "Immagine About", name: about_image, widget: image, i18n: true }
          - { label: "Eyebrow Workshop — EN", name: workshop_eyebrow, widget: string, i18n: true }
          - { label: "Titolo Workshop — EN", name: workshop_title, widget: string, i18n: true }
          - { label: "Testo Workshop — EN", name: workshop_text, widget: text, i18n: true }
          - { label: "Titolo Manifesto — EN", name: manifesto_title, widget: string, i18n: true }
          - { label: "CTA — EN", name: contact_cta, widget: string, i18n: true }
          - label: "Visibilità sezioni"
            name: section_visibility
            widget: object
            fields:
              - { label: "Workshop", name: workshop, widget: boolean, i18n: true, default: true }
              - { label: "Custom Frames", name: custom, widget: boolean, i18n: true, default: true }
              - { label: "Progetti in evidenza", name: featured, widget: boolean, i18n: true, default: true }
              - { label: "About", name: about, widget: boolean, i18n: true, default: true }
              - { label: "Contatti", name: contact, widget: boolean, i18n: true, default: true }
          - label: "Ordine delle sezioni"
            name: section_order
            widget: list
            hint: "Trascina le voci per cambiare l'ordine delle sezioni in homepage."
            field: { label: "Sezione", name: section, widget: select, i18n: true, options: ["workshop", "custom", "featured", "about", "contact"] }
      - name: about
        label: "02 — About / Studio"
        i18n: true
        file: content/pages/about.json
        format: json
        fields:
          - { label: "Etichetta — EN", name: eyebrow, widget: string, i18n: true }
          - { label: "Titolo — EN", name: title, widget: string, i18n: true }
          - { label: "Introduzione — EN", name: lead, widget: text, i18n: true }
          - { label: "Immagine pagina", name: image, widget: image, i18n: true }
          - { label: "Testo — EN", name: body, widget: markdown, i18n: true }
      - name: custom
        label: "03 — Su misura"
        i18n: true
        file: content/pages/custom.json
        format: json
        fields:
          - { label: "Etichetta — EN", name: eyebrow, widget: string, i18n: true }
          - { label: "Titolo — EN", name: title, widget: string, i18n: true }
          - { label: "Introduzione — EN", name: lead, widget: text, i18n: true }
          - { label: "Immagine pagina", name: image, widget: image, i18n: true }
          - { label: "Testo — EN", name: body, widget: markdown, i18n: true }
      - name: contact
        label: "04 — Contatti"
        i18n: true
        file: content/pages/contact.json
        format: json
        fields:
          - { label: "Etichetta — EN", name: eyebrow, widget: string, i18n: true }
          - { label: "Titolo — EN", name: title, widget: string, i18n: true }
          - { label: "Introduzione — EN", name: lead, widget: text, i18n: true }
          - { label: "Email", name: email, widget: string, i18n: true, required: false }
          - { label: "Instagram", name: instagram, widget: string, i18n: true, required: false }
          - { label: "Testo — EN", name: body, widget: markdown, i18n: true }

  - name: projects
    i18n: true
    label: "05 — Progetti"
    files:
      - name: projects
        label: Elenco progetti
        file: content/projects.json
        i18n: true
        format: json
        fields:
          - label: Progetti
            name: projects
            widget: list
            summary: "{{fields.title}} — {{fields.category}}"
            fields:
              - { label: "Slug URL (non modificare se già online)", name: slug, widget: string, i18n: true }
              - { label: "Titolo — EN", name: title, widget: string, i18n: true }
              - { label: "Categoria — EN", name: category, widget: string, i18n: true }
              - { label: Anno, name: year, widget: string, i18n: true, required: false }
              - { label: "Immagine copertina", name: cover, widget: image, i18n: true }
              - { label: "Galleria immagini", name: gallery, widget: list, i18n: true, required: false, field: { label: Immagine, name: image, widget: image } }
              - { label: "Descrizione — EN", name: description, widget: markdown, i18n: true }
              - { label: "In evidenza in homepage", name: featured, widget: boolean, i18n: true, default: false }

  - name: custom_gallery
    i18n: true
    label: "06 — Archivio Su misura"
    files:
      - name: custom_gallery
        label: "Categorie e gallerie"
        file: content/custom-gallery.json
        i18n: true
        format: json
        fields:
          - label: Categorie
            name: collections
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "Nome — EN", name: title, widget: string, i18n: true }
              - { label: "Immagine principale", name: hero, widget: image, i18n: true }
              - { label: "Altre immagini", name: images, widget: list, i18n: true, required: false, field: { label: Immagine, name: image, widget: image } }
