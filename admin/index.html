<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1eb">
  <meta name="description" content="LIMBO Studio — Content Manager">
  <title>LIMBO Studio — Content Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;min-height:100%;background:#f4f1eb}
    body{font-family:"DM Sans",Arial,sans-serif}
    #cms-loading{position:fixed;inset:0;display:grid;place-items:center;background:#f4f1eb;color:#171717;z-index:0}
    #cms-loading .inner{display:flex;align-items:center;gap:14px;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
    #cms-loading img{width:54px;height:auto}
    #cms-loading .dot{width:6px;height:6px;border-radius:50%;background:#d4fa36;animation:pulse 1s infinite alternate}
    @keyframes pulse{to{opacity:.25;transform:scale(.7)}}
  </style>
</head>
<body>
  <div id="cms-loading" aria-hidden="true"><div class="inner"><img src="/assets/limbo-logo.svg" alt=""><span>Studio manager</span><i class="dot"></i></div></div>
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script data-cfasync="false" src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  <script src="/admin/preview.js"></script>
  <script>window.CMS.init();</script>
</body>
</html>
