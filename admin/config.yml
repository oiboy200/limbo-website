i18n:
  structure: multiple_folders
  locales: [it, en]
  default_locale: it

backend:
  name: github
  repo: oiboy200/limbo-website
  branch: main
  base_url: https://limbo-cms-auth.giovanniongaro86.workers.dev
  auth_endpoint: auth
  auth_methods: [oauth]
media_folder: "uploads"
public_folder: "/uploads"
site_url: "https://limbo-website.pages.dev"
display_url: "https://limbo-website.pages.dev"
logo_url: "/assets/limbo-logo-original.png"

collections:
  - name: content
    label: PAGINE DEL SITO
    i18n: true
    files:
      - name: home
        label: "01 — Homepage"
        file: content/{{locale}}/pages/home.json
        i18n: true
        format: json
        fields:
          - label: "00 — Hero"
            name: hero
            widget: object
            i18n: true
            fields:
              - { label: Testo principale, name: intro, widget: text, i18n: true }
          - label: "01 — Workshop"
            name: workshop
            widget: object
            i18n: true
            fields:
              - { label: Immagine, name: image, widget: image, i18n: sync }
              - { label: Titolo, name: title, widget: string, i18n: true }
              - { label: Testo, name: text, widget: text, i18n: true }
              - { label: Etichetta, name: eyebrow, widget: string, i18n: true }
          - label: "02 — Custom Frames / Su misura"
            name: custom
            widget: object
            i18n: true
            fields:
              - { label: Immagine, name: image, widget: image, i18n: sync }
              - { label: Titolo manifesto, name: manifesto_title, widget: string, i18n: true }
          - label: "03 — Progetti in evidenza"
            name: featured
            widget: object
            i18n: true
            fields:
              - { label: Nota, name: help, widget: string, default: "Gestisci i progetti e attiva 'Mostra in homepage' nella pagina Projects.", i18n: duplicate }
          - label: "04 — About"
            name: about
            widget: object
            i18n: true
            fields:
              - { label: Immagine, name: image, widget: image, i18n: sync }
          - label: "05 — Contact"
            name: contact
            widget: object
            i18n: true
            fields:
              - { label: Testo principale, name: cta, widget: string, i18n: true }
          - label: "Impostazioni layout"
            name: layout
            widget: object
            i18n: duplicate
            fields:
              - label: Mostra/nascondi sezioni
                name: visibility
                widget: object
                fields:
                  - { label: Workshop, name: workshop, widget: boolean }
                  - { label: Su misura, name: custom, widget: boolean }
                  - { label: Progetti in evidenza, name: featured, widget: boolean }
                  - { label: About, name: about, widget: boolean }
                  - { label: Contatti, name: contact, widget: boolean }
              - label: Ordine sezioni
                name: order
                widget: list
                field: { label: Sezione, name: section, widget: select, options: ["workshop", "custom", "featured", "about", "contact"] }

      - name: projects
        label: "02 — Projects"
        file: content/{{locale}}/projects.json
        i18n: true
        format: json
        fields:
          - label: Elenco progetti
            name: projects
            widget: list
            i18n: sync
            summary: "{{fields.title}}"
            fields:
              - { label: Titolo, name: title, widget: string, i18n: true }
              - { label: Categoria, name: category, widget: string, i18n: true }
              - { label: Descrizione, name: description, widget: markdown, i18n: true }
              - { label: Copertina, name: cover, widget: image, i18n: sync }
              - { label: Galleria immagini, name: gallery, widget: list, i18n: sync, field: { label: Immagine, name: image, widget: image, i18n: sync } }
              - { label: Anno, name: year, widget: string, i18n: duplicate }
              - { label: Mostra in homepage, name: featured, widget: boolean, i18n: duplicate }
              - { label: Slug URL (non modificare), name: slug, widget: string, i18n: duplicate }

      - name: about
        label: "03 — About / Studio"
        file: content/{{locale}}/pages/about.json
        i18n: true
        format: json
        fields:
          - label: Contenuti pagina
            name: page
            widget: object
            i18n: true
            fields:
              - { label: Etichetta, name: eyebrow, widget: string, i18n: true }
              - { label: Titolo, name: title, widget: string, i18n: true }
              - { label: Introduzione, name: lead, widget: text, i18n: true }
              - { label: Immagine, name: image, widget: image, i18n: sync }
              - { label: Testo, name: body, widget: markdown, i18n: true }

      - name: custom
        label: "04 — Custom / Su misura"
        file: content/{{locale}}/pages/custom.json
        i18n: true
        format: json
        fields:
          - label: Contenuti pagina
            name: page
            widget: object
            i18n: true
            fields:
              - { label: Etichetta, name: eyebrow, widget: string, i18n: true }
              - { label: Titolo, name: title, widget: string, i18n: true }
              - { label: Introduzione, name: lead, widget: text, i18n: true }
              - { label: Immagine, name: image, widget: image, i18n: sync }
              - { label: Testo, name: body, widget: markdown, i18n: true }
          - label: Archivio immagini della pagina
            name: gallery
            widget: list
            i18n: sync
            summary: "{{fields.title}}"
            fields:
              - { label: Nome sezione, name: title, widget: string, i18n: true }
              - { label: Immagine principale, name: hero, widget: image, i18n: sync }
              - { label: Altre immagini, name: images, widget: list, i18n: sync, field: { label: Immagine, name: image, widget: image, i18n: sync } }

      - name: contact
        label: "05 — Contact"
        file: content/{{locale}}/pages/contact.json
        i18n: true
        format: json
        fields:
          - label: Contenuti pagina
            name: page
            widget: object
            i18n: true
            fields:
              - { label: Etichetta, name: eyebrow, widget: string, i18n: true }
              - { label: Titolo, name: title, widget: string, i18n: true }
              - { label: Introduzione, name: lead, widget: text, i18n: true }
              - { label: Testo, name: body, widget: markdown, i18n: true }
              - { label: Email, name: email, widget: string, i18n: sync, required: false }
              - { label: Instagram, name: instagram, widget: string, i18n: sync, required: false }

  - name: settings
    label: IMPOSTAZIONI GENERALI
    files:
      - name: media
        label: Logo
        file: content/shared-media.json
        format: json
        fields:
          - { label: Logo LIMBO, name: logo, widget: image }
