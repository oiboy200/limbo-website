i18n:
  structure: multiple_folders
  locales: [it, en]
  default_locale: it

backend:
  name: github
  repo: oiboy200/limbo-website
  branch: main
  base_url: https://limbo-cms-auth.giovanniongaro86.workers.dev
  auth_endpoint: auth
  auth_methods: [oauth]
media_folder: "uploads"
public_folder: "/uploads"
site_url: "https://limbo-website.pages.dev"
display_url: "https://limbo-website.pages.dev"
logo_url: "/assets/limbo-logo-original.png"

collections:
  - name: settings
    label: "00 — MEDIA CONDIVISI"
    files:
      - name: media
        label: Immagini del sito (uguali in IT e EN)
        file: content/shared-media.json
        format: json
        fields:
          - { label: Logo LIMBO, name: logo, widget: image }
          - { label: Homepage — Workshop, name: home_workshop, widget: image }
          - { label: Homepage — Su misura, name: home_custom, widget: image }
          - { label: Homepage — About, name: home_about, widget: image }
          - { label: Pagina About, name: about_page, widget: image }
          - { label: Pagina Su misura, name: custom_page, widget: image }

  - name: content
    label: "01 — CONTENUTI"
    i18n: true
    files:
      - name: home
        label: Homepage
        file: content/{{locale}}/pages/home.json
        i18n: true
        format: json
        fields:
          - { label: Intro, name: hero_intro, widget: text, i18n: true }
          - { label: Titolo Workshop, name: workshop_title, widget: string, i18n: true }
          - { label: Testo Workshop, name: workshop_text, widget: text, i18n: true }
          - { label: Titolo Manifesto, name: manifesto_title, widget: string, i18n: true }
          - { label: CTA Contatti, name: contact_cta, widget: string, i18n: true }
          - { label: Etichetta Workshop, name: workshop_eyebrow, widget: string, i18n: true, required: false }
          - label: Visibilità sezioni
            name: section_visibility
            widget: object
            i18n: duplicate
            fields:
              - { label: Workshop, name: workshop, widget: boolean }
              - { label: Su misura, name: custom, widget: boolean }
              - { label: Progetti in evidenza, name: featured, widget: boolean }
              - { label: About, name: about, widget: boolean }
              - { label: Contatti, name: contact, widget: boolean }
          - label: Ordine sezioni
            name: section_order
            widget: list
            i18n: duplicate
            field: { label: Sezione, name: section, widget: select, options: ["workshop", "custom", "featured", "about", "contact"] }

      - name: about
        label: About / Studio
        file: content/{{locale}}/pages/about.json
        i18n: true
        format: json
        fields:
          - { label: Etichetta, name: eyebrow, widget: string, i18n: true }
          - { label: Titolo, name: title, widget: string, i18n: true }
          - { label: Introduzione, name: lead, widget: text, i18n: true }
          - { label: Testo, name: body, widget: markdown, i18n: true }

      - name: custom
        label: Su misura
        file: content/{{locale}}/pages/custom.json
        i18n: true
        format: json
        fields:
          - { label: Etichetta, name: eyebrow, widget: string, i18n: true }
          - { label: Titolo, name: title, widget: string, i18n: true }
          - { label: Introduzione, name: lead, widget: text, i18n: true }
          - { label: Testo, name: body, widget: markdown, i18n: true }

      - name: contact
        label: Contatti
        file: content/{{locale}}/pages/contact.json
        i18n: true
        format: json
        fields:
          - { label: Etichetta, name: eyebrow, widget: string, i18n: true }
          - { label: Titolo, name: title, widget: string, i18n: true }
          - { label: Introduzione, name: lead, widget: text, i18n: true }
          - { label: Email, name: email, widget: string, i18n: duplicate, required: false }
          - { label: Instagram, name: instagram, widget: string, i18n: duplicate, required: false }
          - { label: Testo, name: body, widget: markdown, i18n: true }

      - name: projects
        label: Progetti
        file: content/{{locale}}/projects.json
        i18n: true
        format: json
        fields:
          - label: Progetti
            name: projects
            widget: list
            i18n: true
            summary: "{{fields.title}}"
            fields:
              - { label: Slug URL, name: slug, widget: string, i18n: duplicate }
              - { label: Titolo, name: title, widget: string, i18n: true }
              - { label: Categoria, name: category, widget: string, i18n: true }
              - { label: Anno, name: year, widget: string, i18n: duplicate, required: false }
              - { label: Copertina, name: cover, widget: image, i18n: duplicate }
              - { label: Galleria, name: gallery, widget: list, i18n: duplicate, field: { label: Immagine, name: image, widget: image } }
              - { label: Descrizione, name: description, widget: markdown, i18n: true }
              - { label: In evidenza, name: featured, widget: boolean, i18n: duplicate }

      - name: custom_gallery
        label: Archivio Su misura
        file: content/{{locale}}/custom-gallery.json
        i18n: true
        format: json
        fields:
          - label: Categorie
            name: collections
            widget: list
            i18n: true
            summary: "{{fields.title}}"
            fields:
              - { label: Nome, name: title, widget: string, i18n: true }
              - { label: Immagine principale, name: hero, widget: image, i18n: duplicate }
              - { label: Altre immagini, name: images, widget: list, i18n: duplicate, field: { label: Immagine, name: image, widget: image } }
